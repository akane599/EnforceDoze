# SPDX-License-Identifier: GPL-3.0-or-later
# Versions resolved from Maven metadata on 2026-11-08 (AGENTS.md rule 4): dl.google.com/dl/android/maven2,
# repo1.maven.org/maven2, plugins.gradle.org and jitpack.io. Never bump from memory.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
shizuku = "13.1.5"
libsu = "6.0.0"
junit = "4.13.2"
truth = "1.4.5"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
uiautomator = "2.4.1"

# Upstream 1.10.2 dependencies, kept until the classes using them are replaced (SPEC 12.1).
upstream-appcompat = "1.7.0"
upstream-material = "1.12.0"
upstream-browser = "1.8.0"
upstream-media2 = "1.3.0"
upstream-preference = "1.2.1"
upstream-localbroadcastmanager = "1.1.0"
upstream-material-dialogs = "0.9.3.0"
upstream-libsuperuser = "1.1.0.+"
upstream-nanotasks = "1.1.0"
upstream-process-phoenix = "2.1.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

upstream-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "upstream-appcompat" }
upstream-material = { module = "com.google.android.material:material", version.ref = "upstream-material" }
upstream-browser = { module = "androidx.browser:browser", version.ref = "upstream-browser" }
upstream-media2-session = { module = "androidx.media2:media2-session", version.ref = "upstream-media2" }
upstream-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "upstream-preference" }
upstream-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "upstream-localbroadcastmanager" }
upstream-material-dialogs = { module = "com.afollestad.material-dialogs:core", version.ref = "upstream-material-dialogs" }
upstream-libsuperuser = { module = "eu.chainfire:libsuperuser", version.ref = "upstream-libsuperuser" }
upstream-nanotasks = { module = "com.fabiendevos:nanotasks", version.ref = "upstream-nanotasks" }
upstream-process-phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "upstream-process-phoenix" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Built-in Kotlin (AGP 9) compiles Kotlin in Android modules; declaring the JVM plugin in the root
# build pins the Kotlin Gradle plugin version AGP uses and serves pure-JVM modules.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
