# SPDX-License-Identifier: GPL-3.0-or-later
# Versions resolved from Maven metadata on 2026-11-08 (AGENTS.md rule 4): dl.google.com/dl/android/maven2,
# repo1.maven.org/maven2, plugins.gradle.org and jitpack.io. Never bump from memory.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
shizuku = "13.1.5"
libsu = "6.0.0"
# Room, KSP and kotlinx.serialization (SPEC 12.2), resolved from Maven metadata on 2026-11-08.
room = "2.8.5"
ksp = "2.3.13"
serialization = "1.12.0"
# androidx.core for the app's own code, resolved from Maven metadata on 2026-11-08.
androidx-core = "1.19.1"
junit = "4.13.2"
truth = "1.4.5"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
uiautomator = "2.4.1"
# Quality gates (SPEC 12.5), run as CLIs from the root build so they do not depend on AGP's Kotlin
# integration (ADR 0010).
detekt = "1.23.8"
ktlint = "1.8.0"
licensee = "1.14.1"
# Compose and screenshot tests (SPEC 12.2, 10.6), resolved from Maven metadata on 2026-11-08. Roborazzi
# 1.77.0, not 1.78.0: 1.78.0 was published the same day.
compose-bom = "2026.09.00"
# UI layer (ADR 0029), resolved from Maven metadata on 2026-11-08.
navigation3 = "1.2.1"
lifecycle = "2.11.0"
adaptive = "1.3.0"
activity-compose = "1.13.0"
roborazzi = "1.77.0"
robolectric = "4.17"
androidx-test-core = "1.7.0"
# Espresso 3.5 reflects on InputManager.getInstance(), gone on SDK 36; 3.7.0 does not (ADR 0030).
espresso = "3.7.0"

# Upstream 1.10.2 dependencies, kept until the classes using them are replaced (SPEC 12.1).
upstream-appcompat = "1.7.0"
upstream-material = "1.12.0"
upstream-browser = "1.8.0"
upstream-media2 = "1.3.0"
upstream-preference = "1.2.1"
upstream-localbroadcastmanager = "1.1.0"
upstream-material-dialogs = "0.9.3.0"
upstream-libsuperuser = "1.1.0.+"
upstream-nanotasks = "1.1.0"
upstream-process-phoenix = "2.1.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-text = { module = "androidx.compose.ui:ui-text" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

upstream-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "upstream-appcompat" }
upstream-material = { module = "com.google.android.material:material", version.ref = "upstream-material" }
upstream-browser = { module = "androidx.browser:browser", version.ref = "upstream-browser" }
upstream-media2-session = { module = "androidx.media2:media2-session", version.ref = "upstream-media2" }
upstream-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "upstream-preference" }
upstream-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "upstream-localbroadcastmanager" }
upstream-material-dialogs = { module = "com.afollestad.material-dialogs:core", version.ref = "upstream-material-dialogs" }
upstream-libsuperuser = { module = "eu.chainfire:libsuperuser", version.ref = "upstream-libsuperuser" }
upstream-nanotasks = { module = "com.fabiendevos:nanotasks", version.ref = "upstream-nanotasks" }
upstream-process-phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "upstream-process-phoenix" }

# UI layer (ADR 0029).
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "adaptive" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
# Build logic (ADR 0029): the plugins the feature convention plugin applies, at the versions above.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Built-in Kotlin (AGP 9) compiles Kotlin in Android modules; declaring the JVM plugin in the root
# build pins the Kotlin Gradle plugin version AGP uses and serves pure-JVM modules.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
