name: Build APK

# Produces an installable APK on demand. Pick the branch in the "Run workflow"
# dialog; the APK lands in the run's Artifacts section. Release builds are
# signed when the KEYSTORE_* secrets exist, otherwise they come out unsigned.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK to build
        type: choice
        default: debug
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Name this build
        id: build
        run: |
          version=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "label=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        id: signing
        if: inputs.variant != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; the release APK will be unsigned." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: inputs.variant != 'release'
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        if: inputs.variant != 'debug'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            # Same injected-signing properties the release workflow already uses.
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_ALIAS_PASSWORD"
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Summarize the APKs
        run: |
          {
            echo "### EnforceDoze ${{ steps.build.outputs.label }}"
            echo
            echo "| APK | Size | Installable |"
            echo "| --- | ---- | ----------- |"
            for apk in $(find app/build/outputs/apk -name '*.apk' -not -path '*androidTest*' | sort); do
              size=$(du -h "$apk" | cut -f1)
              case "$apk" in
                *-unsigned.apk) installable='No — unsigned, add the KEYSTORE_* secrets' ;;
                *) installable='Yes' ;;
              esac
              echo "| \`$(basename "$apk")\` | $size | $installable |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: inputs.variant != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: enforcedoze-debug-${{ steps.build.outputs.label }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        if: inputs.variant != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: enforcedoze-release-${{ steps.build.outputs.label }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
