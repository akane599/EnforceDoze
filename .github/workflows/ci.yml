# CI gate (SPEC 12.5, 14 P0). P0 skeleton: build, unit tests, Android Lint against the upstream
# baseline, and the no-network rule (SPEC 1.3). detekt, ktlint, screenshot tests, `npx impeccable
# detect` and the licence check join as the Kotlin modules and screens arrive (ADR 0003).
# Actions are pinned to commit SHAs; the tag is in the trailing comment. Re-resolve when bumping.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Upstream targets Java 17 (app/build.gradle); the toolchain moves to JDK 21 with the Kotlin
      # modules in P1 (SPEC 12.2).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint (fails on issues not in app/lint-baseline.xml)
        run: ./gradlew lintDebug

      # SPEC 1.3: no network permission, checked on the merged manifest so a library cannot add it.
      - name: No network permission
        run: |
          manifest=app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
          test -f "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "android.permission.INTERNET is in the merged manifest"; exit 1
          fi
          echo "No INTERNET permission in $manifest"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
